[tools]
clang-format = "latest"
lefthook = "latest"

[tasks.format]
shell = "bash -c"
run = """
{% raw %}
shopt -s nullglob

if [ $# -gt 0 ]; then
  files=("$@")
else
  files=()
  while IFS= read -r -d '' file; do
    files+=("${file#./}")
  done < <(find . -type d -name .git -prune -o -type f '(' -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' ')' -print0)
fi

if [ ${#files[@]} -eq 0 ]; then
  echo "No matching files found."
  exit 0
fi

clang-format -i "${files[@]}"
{% endraw %}
"""

[tasks.install]
run = "lefthook install"
